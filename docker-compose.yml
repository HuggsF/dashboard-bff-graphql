services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dashboard_bff
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP ping: the temporary server MySQL runs during first-boot initialisation only listens
      # on the socket, so this check stays red until the real server accepts connections.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    # Migrates + seeds the SPEC volumes on first start (skipped when data exists), then runs the API.
    command: ["sh", "-c", "npm run seed -- --if-empty && npm run dev"]
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=3000
      - LOG_LEVEL=info
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=dashboard_bff
      - DB_MIGRATE_ON_START=true
      - CORS_ORIGINS=http://localhost:${FRONTEND_HOST_PORT:-5173}
      - GRAPHQL_PLAYGROUND=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Same-origin for the browser: the frontend server proxies /api, /graphql and /health.
      - BACKEND_URL=http://backend:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  mysql_data:
